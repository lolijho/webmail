services:
  webmail:
    build: .
    expose:
      - '3000'
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      # Cifratura dei segreti salvati (IMAP password, chiavi Resend).
      # Genera una chiave: openssl rand -base64 32
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Chiave Resend globale (facoltativa: ogni utente può usare la propria).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Metti "false" per disabilitare la registrazione dopo aver creato gli utenti.
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      DATA_DIR: /app/data
    volumes:
      - webmail-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  webmail-data:
